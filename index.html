
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#FAF7F2">
    <meta name="description" content="A little space for our dates, memories and adventures.">

    <link rel="manifest" href="manifest.json">

    <title>TwoPaws</title>

    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <div class="app-container">

        <!-- Application Header -->
        <header class="app-header">
            <div>
                <p class="eyebrow">OUR LITTLE SPACE</p>
                <h1>TwoPaws <span>♡</span></h1>
            </div>

            <button class="profile-button" aria-label="Profile">
                🐾
            </button>
        </header>

        <!-- Dynamic Application Content -->
        <main id="app-content">
            <p>Loading TwoPaws...</p>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" aria-label="Main navigation">

            <button class="nav-item active" data-page="home">
                <span>⌂</span>
                <small>Home</small>
            </button>

            <button class="nav-item" data-page="calendar">
                <span>▦</span>
                <small>Calendar</small>
            </button>

            <button class="nav-item" data-page="activities">
                <span>♡</span>
                <small>Activities</small>
            </button>

            <button class="nav-item" data-page="settings">
                <span>⚙</span>
                <small>Settings</small>
            </button>

        </nav>

    </div>

    <script src="src/js/database.js"></script>
    <script src="src/js/app.js"></script>

    <script type="module" src="src/js/firebase.js"></script>
    <script type="module" src="src/js/auth.js"></script>
    <script type="module" src="src/js/drive.js"></script>

    <script>
    // Register TwoPaws Service Worker

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker.register("./service-worker.js")
                .then(registration => {

                    console.log(
                        "TwoPaws Service Worker registered:",
                        registration.scope
                    );

                })
                .catch(error => {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                });

        });

    }
</script>

</body>
</html>
